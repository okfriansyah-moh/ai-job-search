  <meta name="description" content="An Introduction to Primer

Primer is the unified infrastructure for global payments. We give finance and payments teams the visibility and control to reduce complexity, improve performance, and capture more revenue - all from a single platform.

Backed by Sofina, Peak XV Partners, ICONIQ, Tencent, Accel, and Balderton, we&#39;re building the payments layer the world&#39;s best companies rely on.

Watch our showcase &gt; https://primer.io/the-primer-showcase

Read up on our $100m Series C https://www.primer.io/blog/series-c

Learn more about our culture &gt; https://primer.io/careers


WHAT WILL YOU BE DOING?

 - Lead a cross-functional team spanning frontend, mobile and backend, helping engineers grow beyond their original specialism and supporting them as they pick up unfamiliar parts of the stack

 - Own a defined area of software architecture, taking responsibility for delivery, quality, and technical direction

 - Run an effective development process: sprint health, delivery cadence, incident response, postmortems, and a sustainable on-call rotation that doesn&#39;t burn people out

 - Grow the engineers on your team through regular feedback, performance conversations, and stretch assignments that actually move people forward

 - Work closely with product to scope initiatives, identify risks, and prioritise deliverables, giving clear heads-up when capacity is constrained

 - Stay close enough to your team&#39;s technical work to ask the right questions, spot risks early, and contribute meaningfully to design discussions without becoming a bottleneck

 - Define the right metrics for your team&#39;s systems, use them to explain performance, catch variance, and drive improvements before they become incidents

 - Handle the difficult conversations, whether that&#39;s performance issues, interpersonal friction, or delivery risk, before they become problems that need escalating



WHAT WE&#39;RE LOOKING FOR

 - Comfortable leading a cross-functional team. Either you&#39;ve managed engineers across frontend, mobile and backend before, or you&#39;re genuinely open to it and to ramping up on the parts of the stack you know less well

 - A background as a software engineer, with hands-on experience building and shipping production systems. This is a hard requirement.

 - Experience managing a team of engineers, with a track record of building effective development processes and growing individual contributors

 - Technically credible enough to evaluate design decisions, challenge assumptions, and be taken seriously by strong engineers, without needing to be the most technical person in the room

 - Comfortable with operational ownership: on-call culture, incident management, postmortems, and the unglamorous work of keeping systems healthy

 - Clear, direct communication with stakeholders and leadership, including knowing when and how to escalate and when not to

 - Able to operate with meaningful autonomy: you don&#39;t need a playbook for every situation, but you know when to ask for one

Nice to have:

 - Direct experience managing full-stack or cross-functional teams. However this team is backend leaning (Python).

 - Experience in fintech, payments, or a similarly regulated and high-stakes technical domain

 - Familiarity with distributed systems and the trade-offs that come with high-throughput, high-availability infrastructure


✅ A TYPICAL INTERVIEW PROCESS

 - An initial intro call with a Talent Partner

 - An interview with the Hiring Manager

 - Challenge Stage - Contextualised to the role

 - A final, values-alignment interview


WHAT&#39;S THE CULTURE LIKE AT PRIMER?


We&#39;re building a culture where people can do their best work and be proud of the impact they have. You&#39;ll be working with people who are mission-driven, smart, and reflective, and who are genuinely invested in building exceptional products and delivering success for our merchants.

We work remotely, and have done since day one. We believe that building a successful, profitable company goes beyond proximity. We invest in our relationships through great remote working practices and thoughtfully designed face-to-face time, including workations, our annual company retreat, and access to co-working spaces across most major cities.

The work is challenging. Scaleups are a challenge, and building category-defining products is a challenge. But there&#39;s a meaningful difference between a challenge and a struggle. At Primer, the right challenge comes with the right support: strong onboarding, a collaborative environment, and a team that is genuinely invested in your success. It&#39;s never something you face alone.


OUR BENEFITS

🌍 We are fully remote and globally distributed; and have been since day one
💰 Competitive share options
🌴 Uncapped holiday, with 25 days minimum to be taken
🗣️ Co-working space access across major cities
📅 Workations &amp; Company Retreat
💻 The best equipment for your role
🏠 £500 towards your home office setup
🔎 Generous learning budget
🏥 Private Medical Insurance
📈 A broad set of additional perks and benefits (depending on location)


DON’T MEET EVERY SINGLE REQUIREMENT?

At Primer, we&#39;re dedicated to building a diverse, inclusive, and authentic workplace. If you&#39;re excited about this role but your experience doesn&#39;t align perfectly with every qualification listed, we encourage you to apply. You may be the right candidate for this or other roles.

Primer is committed to the equal treatment of all current and prospective employees and adopts a zero-tolerance approach to discrimination, regardless of age, disability, sex, sexual orientation, pregnancy and maternity, race or ethnicity, religion or belief, gender identity, marriage and civil partnership, or any other background or belief." />

er, with hands-on experience building and shipping production systems. This is a hard requirement.</p></li><li><p style=\"min-height:1.5em\">Experience managing a team of engineers, with a track record of building effective development processes and growing individual contributors</p></li><li><p style=\"min-height:1.5em\">Technically credible enough to evaluate design decisions, challenge assumptions, and be taken seriously by strong engineers, without needing to be the most technical person in the room</p></li><li><p style=\"min-height:1.5em\">Comfortable with operational ownership: on-call culture, incident management, postmortems, and the unglamorous work of keeping systems healthy</p></li><li><p style=\"min-height:1.5em\">Clear, direct communication with stakeholders and leadership, including knowing when and how to escalate and when not to</p></li><li><p style=\"min-height:1.5em\">Able to operate with meaningful autonomy: you don't need a playbook for every situation, but you know when to ask for one</p></li></ul><p style=\"min-height:1.5em\">Nice to have:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Direct experience managing full-stack or cross-functional teams. However this team is backend leaning (Python).</p></li><li><p style=\"min-height:1.5em\">Experience in fintech, payments, or a similarly regulated and high-stakes technical domain</p></li><li><p style=\"min-height:1.5em\">Familiarity with distributed systems and the trade-offs that come with high-throughput, high-availability infrastructure</p></li></ul><p style=\"min-height:1.5em\"></p><h2>✅ A typical interview process</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">An initial intro call with a Talent Partner</p></li><li><p style=\"min-height:1.5em\">An interview with the Hiring Manager</p></li><li><p style=\"min-height:1.5em\">Challenge Stage - Contextualised to the role</p></li><li><p style=\"min-height:1.5em\">A final, values-alignment interview</p><p style=\"min-height:1.5em\"></p></li></ul><h2><strong>What's the culture like at Primer?</strong></h2><p style=\"min-height:1.5em\"><br />We're building a culture where people can do their best work and be proud of the impact they have. You'll be working with people who are mission-driven, smart, and reflective, and who are genuinely invested in building exceptional products and delivering success for our merchants.<br /><br />We work remotely, and have done since day one. We believe that building a successful, profitable company goes beyond proximity. We invest in our relationships through great remote working practices and thoughtfully designed face-to-face time, including workations, our annual company retreat, and access to co-working spaces across most major cities.<br /><br />The work is challenging. Scaleups are a challenge, and building category-defining products is a challenge. But there's a meaningful difference between a challenge and a struggle. At Primer, the right challenge comes with the right support: strong onboarding, a collaborative environment, and a team that is genuinely invested in your success. It's never something you face alone.</p><p style=\"min-height:1.5em\"></p><h2>Our benefits</h2><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">🌍 We are fully remote and globally distributed; and have been since day one<br />💰 Competitive share options<br />🌴 Uncapped holiday, with 25 days minimum to be taken<br />🗣️ Co-working space access across major cities<br />📅 Workations &amp; Company Retreat<br />💻 The best equipment for your role<br />🏠 £500 towards your home office setup<br />🔎 Generous learning budget<br />🏥 Private Medical Insurance<br />📈 A broad set of additional perks and benefits (<em>depending on location)</em></p><p style=\"min-height:1.5em\"></p><h2>Don’t meet every single requirement?</h2><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">At Primer, we're dedicated to building a diverse, inclusive, and authe
