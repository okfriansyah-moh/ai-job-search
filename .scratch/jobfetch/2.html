    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Engineering Manager","description":"<h2><strong>About Yendo</strong></h2><p style=\"min-height:1.5em\">Hi there, we're Yendo, and our vision is to empower everyday people to build a stronger financial future. In less than 2 years, we’ve saved customers over $100 million in unnecessary interest and fees.</p><p style=\"min-height:1.5em\">We are using AI to unlock the $1.1 Trillion in vehicle equity trapped within cars owned by Americans in the form of a high limit, standard rate credit card for those traditionally excluded from mainstream financial offerings.</p><p style=\"min-height:1.5em\">Yendo Credit Cards have similar APRs to those issued for prime borrowers with no hidden fees or overdraft charges and help build their customers' credit score. Yendo's credit limits are 4x higher than cards typically available for non-prime borrowers.</p><h2>Role Overview</h2><p style=\"min-height:1.5em\">This is the manager seat for the engineering team behind our application process, the highest-traffic surface we run and the front door for every prospective customer. You'll own the team's people, its technical direction, and its delivery, and you'll do it as a player-coach.</p><p style=\"min-height:1.5em\">A word on how we think about management. At Yendo, engineering managers <em>are</em> technical leaders. We don't split the \"tech lead\" and \"people manager\" tracks. Our managers are among the strongest engineers on their teams: they stay close to the code, they set architecture, and they earn their team's trust by being a credible technical partner. If you love building and want to multiply your impact through a team <em>without</em> giving up the craft, you'll fit here.</p><p style=\"min-height:1.5em\">We're also growing fast, and we bet on trajectory. The application process is one of the most consequential surfaces in the company, a place where delivering creates its own next opportunity, for you and for the engineers you grow.</p><h2>What you'll own</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Lead the team.</strong> Coaching, career growth, feedback, performance, and hiring for the backend engineers building our application process.</p></li><li><p style=\"min-height:1.5em\"><strong>Set and defend technical direction.</strong> Architecture, quality bar, and delivery. You're accountable for what the team ships and how well it holds up in production.</p></li><li><p style=\"min-height:1.5em\"><strong>Stay hands-on.</strong> Design reviews, code reviews, and rolling up your sleeves on the hardest problems. You won't write the most code on the team, but you'll be one of the people it trusts most on technical calls.</p></li><li><p style=\"min-height:1.5em\"><strong>Own outcomes end to end. </strong>Partner with product, design, and the rest of engineering to take problems from ambiguous to shipped, and raise the bar on how we build along the way.</p></li><li><p style=\"min-height:1.5em\"><strong>Recruit and raise the bar. </strong>Help us hire exceptional engineers and level up our engineering practices as we scale.</p></li></ul><h2>Who you are</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>A strong engineer first.</strong> You operate at a staff level as an IC, the kind of technical depth an 8+ year career produces: deep systems thinking, sound architecture, and real fluency with life cycles, edge cases, interactions, and failure modes.</p></li><li><p style=\"min-height:1.5em\"><strong>An experienced people leader.</strong> You've formally managed an engineering team (1+ year), and you're ready to do it with more scope and a steeper trajectory than your current seat allows.</p></li><li><p style=\"min-height:1.5em\"><strong>Fluent in a statically typed language.</strong> We're a Go shop; Go experience is ideal, but strong experience in another static, typed language (Java, etc.) plus the appetite to ramp on Go quickly is very welcome.</p></li><li><p style=\"min-height:1.5em\"><strong>A multiplier.</strong> You make the engineers around you better, and people want to work for you again.</p></li><li><p style=\"min-height:1.5em\"><strong>Passionate about financial inclusion and mobility.</strong></p></li></ul><h2>Bonus points</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Go + fintech, payments, card networks, processing, lending, or banking.</p></li><li><p style=\"min-height:1.5em\">Postgres, Redis, and AWS.</p></li><li><p style=\"min-height:1.5em\">Early-stage startup experience.</p></li></ul><h2><strong>Why join us</strong></h2><p style=\"min-height:1.5em\">🤝 You can make a real impact to the lives of our customers.</p><p style=\"min-height:1.5em\">💳 100 million Americans lack access to sustainable credit and are forced to use predatory loans. Think 500%+ APR alternative financing options such as Auto Title, Payday, Pawn, and Personal Loans. Each year almost 25% of adults are excluded from the mainstream credit system, severely inhibiting their chances of accessing affordable borrowing, getting a mortgage, or even an auto loan.</p><p style=\"min-height:1.5em\">👨‍💼 Our executive team has multiple exits under their belts, having founded $100M+ revenue companies. Additionally, many executives have held leadership roles at public comapny and unicorn startups alike.</p><p style=\"min-height:1.5em\">🧠 We are backed by leading VCs, accomplished entrepreneurs, respected philanthropists, and founders from across the U.S. Our backers are the minds and investors behind the success of the Apple Card, Brex, Dave, Scribd, Parse, Canva, Robinhood, Flexport, Gusto, Reddit, Notion, LinkedIn, among others.</p><p style=\"min-height:1.5em\">Yendo is based in Dallas, Texas with a nationwide team. This role is remote or in our office in the Deep Ellum area of Dallas.</p><p style=\"min-height:1.5em\">💰 Competitive Compensation</p><p style=\"min-height:1.5em\">📈 Equity</p><p style=\"min-height:1.5em\">🍎 Insurance</p><p style=\"min-height:1.5em\">📊 401K</p><p style=\"min-height:1.5em\">🏝 Unlimited PTO</p><p style=\"min-height:1.5em\"><strong>Our core values</strong></p><ol style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Our customers are our compass</strong> - We prioritize our customers' needs in every decision, guiding our work to solve real problems and create meaningful solutions. We make a positive impact by enhancing their experiences and addressing what truly matters to them.</p></li><li><p style=\"min-height:1.5em\"><strong>Trust is earned, not assumed -</strong> We communicate openly, honestly, and with humility, earning trust through integrity and clarity in all interactions. By prioritizing straightforward communication and actions, we build strong relationships and ensure our intentions are always understood.</p></li><li><p style=\"min-height:1.5em\"><strong>Diverse perspectives, stronger outcomes -</strong> We serve diverse customers and believe that different perspectives make us stronger. Committed to equity, we value each team member, ensuring all voices are heard and respected. By fostering an inclusive culture, we empower fair and meaningful contributions to drive our success.</p></li><li><p style=\"min-height:1.5em\"><strong>Embrace Growth Together -</strong> We are drivers, we move with urgency, and we strive for excellence in everything we do. Our customers deserve the best, so we hold ourselves accountable to high standards. Through proactive ownership, thoughtful execution, and a commitment to bettering ourselves and our work every day, we deliver results that make a lasting impact.</p></li><li><p style=\"min-height:1.5em\"><strong>Own every outcome -</strong> Rooted in expertise and creativity, innovation is at our core. We challenge norms, push past limitations, and seek to redefine boundaries. Yesterday’s plan may be outdated given today’s information and by questioning assumptions and challenging one another, we stay agile and open-minded, turning every situation into an opportunity to delight our customers.</p></li><li><p style=\"min-height:1.5em\"><strong>Courage to challenge -</strong> Low ego, coaching, and mutual respect are the foundation of our teamwork. We empower each other and solve problems collaboratively without blame, creating a space for everyone to thrive and contribute to our collective success.</p></li></ol>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Yendo","value":"f6a07a9f-409e-4c16-9024-d47b4eb76169"},"datePosted":"2026-07-31","hiringOrganization":{"@type":"Organization","name":"Yendo","sameAs":"https://www.yendo.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/a0b5ff18-2fe0-42f4-91fb-4d0f90cb96e9/857d0ddd-beeb-4967-b257-036ace65756f/c7e04581-832c-4e1a-92fa-d28c178b276f.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"San Francisco","addressRegion":"CA","addressCountry":"United States"}},"employmentType":"FULL_TIME","baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","minValue":180000,"maxValue":220000,"unitText":"YEAR"}},"jobLocationType":"TELECOMMUTE","applicantLocationRequirements":{"@type":"Country","name":"United States"}}</script>
